<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Self-hosted Inter (variable woff2). Preload latin BEFORE any 3rd-party
         script so the font arrives in time for the first text paint (LCP).
         fetchpriority=high tells the browser to prioritize this over chunked JS. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
      fetchpriority="high"
    />

    <!-- Cookiebot (async so it does not render-block the LCP) -->
    <script
      id="Cookiebot"
      src="https://consent.cookiebot.com/uc.js"
      data-cbid="71ee8ac9-9b38-4881-a659-b76fc90f100b"
      data-blockingmode="explicit"
      type="text/javascript"
      async
    ></script>
    <!-- End Cookiebot -->

    <!-- Google Tag Manager -->
    <script>
      // Initialize dataLayer BEFORE GTM loads
      window.dataLayer = window.dataLayer || [];

      // Function to load GTM
      function loadGTM() {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-TD44B9JT');
      }

      // Wait for Cookiebot to be ready
      if (window.CookiebotOnConsentReady === undefined) {
        window.CookiebotOnConsentReady = [];
      }

      // Push GTM loading to Cookiebot's callback
      window.CookiebotOnConsentReady.push(loadGTM);

      // Fallback: Load GTM if Cookiebot is already ready or doesn't load
      setTimeout(function() {
        if (!window.gtag) {
          loadGTM();
        }
      }, 3000);
    </script>
    <!-- End Google Tag Manager -->

    <!-- Self-hosted Inter (variable woff2). Preload latin so text renders without a network roundtrip. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Dynamic Meta-Tags (title, description, canonical, og:*, twitter:*, JSON-LD) werden -->
    <!-- pro Route von React-Helmet via PageHead/JsonLd eingefügt (HelmetProvider in App.tsx). -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TD44B9JT"
        height="0"
        width="0"
        style="display:none;visibility:hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
